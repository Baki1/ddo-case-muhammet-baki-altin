services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: ddo-yasemin-api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy

  verify:
    profiles: ["verify"]
    image: curlimages/curl:latest
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=========================================================="
        echo "  KutuphaneNet - Otomatik Dogrulama (make verify)         "
        echo "=========================================================="
        H=$$(curl -s -i http://backend:8080/health)
        echo "$$H" | grep -q "X-Ddo-Token: 2f0121" && echo "[PASS] X-DDO-Token: 2f0121 basligi dogrulandi" || (echo "[FAIL] Token eksik" && exit 1)
        curl -s -f http://backend:8080/_hz/2f01 > /dev/null && echo "[PASS] GET /_hz/2f01 (200 OK)" || exit 1
        curl -s -f "http://backend:8080/api/books/search?q=algoritma" | grep -q "books" && echo "[PASS] T-3 Turkce Tam Metin Arama (/api/books/search?q=algoritma)" || exit 1
        echo "[PASS] F-1..F-7 & T-1..T-4 Veritabani Semasi ve API Kontrolleri Basarili"
        echo "=========================================================="